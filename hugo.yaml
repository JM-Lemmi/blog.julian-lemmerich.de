baseURL: https://blog.julian-lemmerich.de/
languageCode: en-gb
title: Julian Lemmerich's Blog
theme: jmlemmi
params:
  siteIdentifier: blog
markup:
  renderer:
    unsafe: true
menus:
  main:
  - name: Posts
    pageRef: /posts
    params:
      icon: newspaper.svg
    weight: 10
  - name: Tags
    pageRef: /tags
    params:
      icon: tag.svg
    weight: 20

